# Active from day one: plain HTTP on any hostname (works with a bare VPS IP).
# After enabling TLS (conf.d/tls.conf) leave this file alone: tls.conf has its own :80 server for the
# domain that redirects to https, and this default server must keep answering 127.0.0.1/health for
# scripts/vps/deploy.sh.
server {
  listen 80 default_server;
  server_name _;

  location / {
    proxy_pass http://web;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }

  location /v1/ {
    limit_req zone=api burst=60 nodelay;

    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Socket.io — long-poll + WebSocket
  location /socket.io/ {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 3600s;
  }

  location /health {
    proxy_pass http://api/v1/health;
    access_log off;
  }
}
