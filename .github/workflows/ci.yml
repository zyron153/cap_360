name: CI

on:
  push:
    branches: [master, staging, develop]
  pull_request:
    branches: [master, staging, develop]

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/cms

jobs:
  # ─── Lint & Typecheck ─────────────────────────────────────────────────────
  quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Lint
        run: pnpm turbo run lint

  # ─── Unit Tests ───────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: maissaude
          POSTGRES_PASSWORD: maissaude
          POSTGRES_DB: maissaude_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://maissaude:maissaude@localhost:5432/maissaude_test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @cap/database run db:generate

      - name: Push schema (test DB)
        # This project uses `prisma db push` for schema sync, not `migrate deploy` — the checked-in
        # migrations predate most of schema.prisma and would leave the test DB badly out of date.
        run: pnpm --filter @cap/database run db:push

      - name: Run tests
        run: pnpm turbo run test

  # ─── Build Docker Images ──────────────────────────────────────────────────
  build:
    name: Build & Push Images
    needs: [quality, test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/staging')
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # master -> tagged "latest" and built against the prod API URL; staging -> tagged
      # "staging" and built against the staging API URL (baked into the web bundle at build time).
      - name: Set per-branch values
        id: vars
        run: |
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            echo "extra_tag=latest" >> "$GITHUB_OUTPUT"
            echo "api_url=${{ vars.PUBLIC_APP_URL }}" >> "$GITHUB_OUTPUT"
          else
            echo "extra_tag=staging" >> "$GITHUB_OUTPUT"
            echo "api_url=${{ vars.STAGING_PUBLIC_APP_URL }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & Push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-api:${{ github.sha }},${{ env.IMAGE_PREFIX }}-api:${{ steps.vars.outputs.extra_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.vars.outputs.api_url }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-web:${{ github.sha }},${{ env.IMAGE_PREFIX }}-web:${{ steps.vars.outputs.extra_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Deploy to Staging (auto, no manual gate) ──────────────────────────────
  # Same single-host Compose runbook as production, on its own VPS. Secrets: STAGING_DEPLOY_HOST,
  # STAGING_DEPLOY_USER, STAGING_DEPLOY_SSH_KEY, STAGING_DEPLOY_PATH; vars: STAGING_PUBLIC_APP_URL.
  deploy-staging:
    name: Deploy to Staging
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'
    environment: staging

    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}

      - name: Deploy
        run: |
          ssh -o StrictHostKeyChecking=accept-new ${{ secrets.STAGING_DEPLOY_USER }}@${{ secrets.STAGING_DEPLOY_HOST }}             "cd ${{ secrets.STAGING_DEPLOY_PATH }} && git pull --ff-only &&              sed -i '/^IMAGE_TAG=/d' .env.prod && echo IMAGE_TAG=${{ github.sha }} >> .env.prod &&              docker compose --env-file .env.prod -f docker-compose.prod.yml pull &&              docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --remove-orphans"

      - name: Smoke test
        run: |
          sleep 30
          curl -fsS "${{ vars.STAGING_PUBLIC_APP_URL }}/v1/health" || exit 1

  # ─── Deploy to Production (manual approval via the `production` environment) ──────
  # Assumes a single Docker host with this repo checked out at $DEPLOY_PATH and an untracked
  # .env.prod next to docker-compose.prod.yml. Secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY,
  # DEPLOY_PATH; vars: PUBLIC_APP_URL. The `migrate` service runs `db push` (no data-loss flag) and
  # the audit_log trigger before the API starts, so a destructive schema change fails the deploy.
  deploy-production:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    environment: production

    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Deploy
        run: |
          ssh -o StrictHostKeyChecking=accept-new ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}             "cd ${{ secrets.DEPLOY_PATH }} && git pull --ff-only &&              sed -i '/^IMAGE_TAG=/d' .env.prod && echo IMAGE_TAG=${{ github.sha }} >> .env.prod &&              docker compose --env-file .env.prod -f docker-compose.prod.yml pull &&              docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --remove-orphans"

      - name: Smoke test
        run: |
          sleep 30
          curl -fsS "${{ vars.PUBLIC_APP_URL }}/v1/health" || exit 1
