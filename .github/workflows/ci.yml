name: CI

# PR checks + the gate for deploys: deploy-staging.yml / deploy-production.yml call this workflow
# first (workflow_call) and only build/deploy if it passes. A push to `staging` is therefore NOT
# listed under `push` — deploy-staging.yml already runs this on that push.
on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, staging, develop]
  workflow_call:

# Only PR runs are cancelled when superseded; a deploy's CI run must always finish.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # pnpm 11 (package.json "packageManager") needs Node >= 22.13. The Docker images still run on
  # Node 20 (engines: >=20) — see Docs/DEPLOYMENT.md.
  NODE_VERSION: "22"

jobs:
  # ─── Lint & Typecheck ─────────────────────────────────────────────────────
  quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` — pnpm/action-setup reads package.json "packageManager" (setting both errors).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Typecheck/lint resolve Prisma types from the generated client (gitignored, so a fresh
      # checkout has none: ~120 "implicit any" / missing-export errors without this).
      - name: Generate Prisma client
        run: pnpm --filter @cap/database run db:generate

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Lint
        run: pnpm turbo run lint

  # ─── Dependency audit ─────────────────────────────────────────────────────
  # Critical advisories in production deps are zero today, so that is a hard gate. High is gated
  # on a baseline (32 when measured 2026-10-03) so it can only go down: lower
  # AUDIT_BASELINE_HIGH as advisories get fixed, and make it 0 to hard-gate High as well.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    env:
      AUDIT_BASELINE_CRITICAL: 0
      AUDIT_BASELINE_HIGH: 32
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # No `cache: pnpm`: this job never installs, so there is no store and the post-step fails.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: pnpm audit (prod deps)
        run: |
          pnpm audit --prod --json > audit.json || true
          pnpm audit --prod || true
          # shellcheck disable=SC2016  # the JS is deliberately single-quoted (backticks are JS template literals)
          node -e '
            const v = require("./audit.json").metadata.vulnerabilities;
            const rows = ["critical","high","moderate","low"].map(k => `| ${k} | ${v[k]} |`).join("\n");
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              `### pnpm audit — production dependencies\n\n| level | count |\n|---|---|\n${rows}\n`);
            const baseC = +process.env.AUDIT_BASELINE_CRITICAL, baseH = +process.env.AUDIT_BASELINE_HIGH;
            if (v.critical > baseC || v.high > baseH) {
              console.log(`::error::advisories regressed — critical ${v.critical}/${baseC}, high ${v.high}/${baseH}`);
              process.exit(1);
            }
            console.log(`ok — critical ${v.critical}/${baseC}, high ${v.high}/${baseH}`);
          '

  # ─── Unit tests (+ migration drift check) ─────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: maissaude
          POSTGRES_PASSWORD: maissaude
          POSTGRES_DB: maissaude_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://maissaude:maissaude@localhost:5432/maissaude_test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @cap/database run db:generate

      # Same command production runs. Then diff the migrated DB against schema.prisma: a change to
      # schema.prisma without a matching migration (what left the old migrations stale) fails here.
      - name: Apply migrations (test DB)
        run: pnpm --filter @cap/database run db:migrate:prod

      - name: Check migrations match schema.prisma
        run: pnpm --filter @cap/database exec prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Run tests
        run: pnpm turbo run test

  # ─── Docker build check (PRs only; deploy workflows build + push on their own) ─────────
  docker-check:
    name: Docker build check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        service: [api, web]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # context is the repo root: the Dockerfiles COPY the whole workspace (packages/, apps/*).
      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.service }}.Dockerfile
          load: true
          push: false
          tags: cms-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      # Docs/DEPLOYMENT.md lesson: dev .env files once leaked into the images via a bad .dockerignore.
      - name: Fail if the image contains .env files
        run: |
          leaked=$(docker run --rm --entrypoint sh cms-${{ matrix.service }}:ci -c 'find /app -name ".env*" -not -name ".env.example" -not -path "*/node_modules/*"')
          if [ -n "$leaked" ]; then echo "::error::.env files in image:"; echo "$leaked"; exit 1; fi
